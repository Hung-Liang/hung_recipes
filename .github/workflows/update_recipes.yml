name: Update Recipe List

on:
  push:
    branches:
      - master
    paths:
      - 'recipes/**'
      - 'asset/nutrition.json'
      - 'update_recipes.py'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'js/**'
      - 'css/style.css'
  pull_request:
    paths:
      - 'recipes/**'
      - 'asset/nutrition.json'
      - 'update_recipes.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate recipes and update index
        run: python3 update_recipes.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add asset/recipes.json asset/info.json index.html sw.js
          git commit -m "🔄 Automated update of recipes and version sync" || echo "No changes to commit"
          git pull --rebase origin master || echo "No remote changes to rebase"
          git push
