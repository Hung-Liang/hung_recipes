name: Update Recipe List

on:
  push:
    branches:
      - master
    paths:
      - 'recipes/**'
      - 'update_recipes.py'
      - 'index.html'
      - 'js/**'
      - 'css/tailwind.input.css'
      - 'tailwind.config.js'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run update script
        run: python3 update_recipes.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: Commit and push changes
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add asset/recipes.json asset/info.json index.html js/app.js js/nutrition.js css/tailwind.css
          git commit -m "🔄 Automated update of recipes and version sync" || echo "No changes to commit"
          git pull --rebase origin master || echo "No remote changes to rebase"
          git push
