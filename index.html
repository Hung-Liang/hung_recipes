<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hung的食譜</title>
    <meta name="description" content="Hung 的家常食譜：以公克秤量，依份數自動換算材料與每份熱量。" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="asset/icon-32.png" />

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f4f3f1" />
    <link rel="apple-touch-icon" sizes="180x180" href="asset/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hung的食譜" />

    <!-- Geist for Latin letters and figures; Chinese falls back to the system face (see --font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS（由 npm run build:css 產生，提供 reset）；版面樣式在 css/style.css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="app">
      <!-- Phone: the sidebar folds into this bar -->
      <header class="topbar">
        <button id="menu-button" class="icon-btn" type="button" aria-label="開啟分類選單" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <a id="topbar-back" class="icon-btn" href="#/" aria-label="返回食譜清單" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </a>
        <span id="topbar-title" class="topbar-title">Hung的食譜</span>
        <button id="topbar-share" class="icon-btn" type="button" aria-label="分享食譜" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" /></svg>
        </button>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="分類">
        <div class="brand">
          <a href="#/" class="brand-link">
            <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
              <path class="fill" d="M2.5 11.5h19a9.5 9.5 0 0 1-19 0z" />
              <path d="M13 9.5l6.5-7M16.5 9.5l5-5.5" />
            </svg>
            <span>Hung的食譜</span>
          </a>
          <button id="menu-close" class="icon-btn" type="button" aria-label="關閉選單">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <p class="group-label">分類</p>
        <nav id="category-nav" class="nav">
          <a class="nav-item" href="#/" data-cat="">全部食譜</a>
          <!-- Categories are injected by js/app.js -->
        </nav>

        <div class="sidebar-bottom">
          <p id="app-version" class="stamp">Version: v1.10.0</p>
          <p class="stamp">安裝到主畫面後可離線使用</p>
        </div>
      </aside>

      <main class="canvas">
        <!-- List screen -->
        <section id="list-view" class="view" aria-labelledby="list-title">
          <div class="title-row">
            <div>
              <h1 id="list-title">全部食譜</h1>
              <p id="list-sub" class="sub">載入中…</p>
            </div>
          </div>

          <div class="list-layout">
            <div class="panel table-panel">
              <table class="recipe-table">
                <caption class="sr-only">食譜清單</caption>
                <thead>
                  <tr>
                    <th scope="col">食譜</th>
                    <th scope="col" class="col-tags">標籤</th>
                    <th scope="col" class="n col-servings">份量</th>
                    <th scope="col" class="n col-kcal" id="kcal-header" aria-sort="none">
                      <button id="sort-kcal" type="button" class="sort-btn">每份熱量<span class="sort-glyph" aria-hidden="true"></span></button>
                    </th>
                  </tr>
                </thead>
                <tbody id="recipe-list">
                  <!-- Loading rows keep the final layout; replaced by js/app.js -->
                  <tr class="loading-row"><td><span class="skeleton" style="width: 9em"></span><span class="skeleton sub-bar" style="width: 18em"></span></td><td class="col-tags"><span class="skeleton" style="width: 6em"></span></td><td class="n col-servings"><span class="skeleton" style="width: 3em"></span></td><td class="n col-kcal"><span class="skeleton" style="width: 4em"></span></td></tr>
                  <tr class="loading-row"><td><span class="skeleton" style="width: 7em"></span><span class="skeleton sub-bar" style="width: 15em"></span></td><td class="col-tags"><span class="skeleton" style="width: 5em"></span></td><td class="n col-servings"><span class="skeleton" style="width: 3em"></span></td><td class="n col-kcal"><span class="skeleton" style="width: 4em"></span></td></tr>
                  <tr class="loading-row"><td><span class="skeleton" style="width: 8em"></span><span class="skeleton sub-bar" style="width: 17em"></span></td><td class="col-tags"><span class="skeleton" style="width: 7em"></span></td><td class="n col-servings"><span class="skeleton" style="width: 3em"></span></td><td class="n col-kcal"><span class="skeleton" style="width: 4em"></span></td></tr>
                </tbody>
              </table>
            </div>

            <aside class="filter-rail" aria-label="搜尋與篩選">
              <div class="search">
                <label for="search-input" class="sr-only">搜尋食譜</label>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
                <input id="search-input" class="input" type="search" placeholder="搜尋食譜或標籤" autocomplete="off" />
              </div>

              <button id="toggle-tags" class="btn filter-toggle" type="button" aria-expanded="false" aria-controls="tags-panel">
                標籤篩選<span id="tag-count-badge" class="count" hidden></span>
              </button>

              <div id="tags-panel" class="panel tags-panel">
                <div class="panel-head">
                  <h2>標籤</h2>
                  <button id="clear-tags" class="card-link" type="button" hidden>清除篩選</button>
                </div>
                <div id="tags-container" class="tag-groups">
                  <!-- Tag groups are injected by js/app.js -->
                </div>
              </div>
            </aside>
          </div>
        </section>

        <!-- Detail screen -->
        <section id="detail-view" class="view" aria-labelledby="recipe-detail-name" hidden>
          <nav class="breadcrumb" aria-label="位置">
            <a href="#/">全部食譜</a>
            <span aria-hidden="true">›</span>
            <a id="detail-category" href="#/">分類</a>
          </nav>

          <div class="title-row">
            <div class="title-text">
              <h1 id="recipe-detail-name">載入中…</h1>
              <p id="recipe-detail-description" class="sub"></p>
              <div id="recipe-detail-tags" class="tag-links"></div>
            </div>
            <button id="share-button" class="btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" /></svg>
              <span>分享食譜</span>
            </button>
          </div>

          <div class="kpis">
            <div class="kpi">
              <label class="kpi-label" for="servings-input">份數</label>
              <div class="stepper">
                <button id="servings-minus" class="step-btn" type="button" aria-label="減少份數">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
                </button>
                <input id="servings-input" class="servings-input" type="number" min="0.1" step="any" inputmode="decimal" />
                <span id="servings-unit" class="unit"></span>
                <button id="servings-plus" class="step-btn" type="button" aria-label="增加份數">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12" /></svg>
                </button>
              </div>
            </div>
            <div class="kpi">
              <p class="kpi-label">每份熱量</p>
              <p class="kpi-value lead"><span id="calories-per-serving">–</span><small>kcal</small></p>
            </div>
            <div class="kpi">
              <p class="kpi-label">整道熱量</p>
              <p class="kpi-value"><span id="calories-total">–</span><small>kcal</small></p>
            </div>
            <div class="kpi">
              <p class="kpi-label">有熱量資料的食材</p>
              <p class="kpi-value"><span id="calories-coverage">–</span></p>
              <p id="calories-missing" class="kpi-note"></p>
            </div>
          </div>

          <div class="detail-grid">
            <section class="panel weigh-sheet" aria-labelledby="ingredients-title">
              <div class="panel-head">
                <h2 id="ingredients-title">材料</h2>
                <button id="release-locks" class="card-link" type="button" hidden>取消所有鎖定</button>
              </div>
              <table class="ingredients">
                <thead>
                  <tr>
                    <th scope="col">食材</th>
                    <th scope="col" class="n">份量</th>
                    <th scope="col" class="n">熱量 kcal</th>
                    <th scope="col" class="col-lock"><span class="sr-only">鎖定份量</span></th>
                  </tr>
                </thead>
                <tbody id="recipe-detail-ingredients"></tbody>
                <tfoot>
                  <tr>
                    <th scope="row">合計</th>
                    <td></td>
                    <td class="n"><span id="ingredients-total">–</span><small>kcal</small></td>
                    <td></td>
                  </tr>
                </tfoot>
              </table>
            </section>

            <div class="detail-side">
              <section class="panel" aria-labelledby="steps-title">
                <div class="panel-head">
                  <h2 id="steps-title">步驟</h2>
                  <span id="steps-meta" class="meta"></span>
                </div>
                <ol id="recipe-detail-steps" class="steps"></ol>
              </section>

              <section id="recipe-detail-notes-container" class="panel" aria-labelledby="notes-title">
                <div class="panel-head">
                  <h2 id="notes-title">注意事項</h2>
                </div>
                <ul id="recipe-detail-notes" class="notes"></ul>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>

    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

    <script src="js/nutrition.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('SW registered');

            // Monitor for updates
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // New content is available, but the user must reload or we can auto-reload
                    console.log('New content is available; please refresh.');
                  }
                }
              };
            };
          }).catch(err => console.log('SW registration failed', err));
        });

        // Refresh the page when the new service worker takes over
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
